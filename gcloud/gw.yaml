apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: media-gateway
  namespace: djmz
spec:
  gatewayClassName: gke-l7-gxlb
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: lxci-net-tls
      mode: Terminate
      #mode: Passthrough
    allowedRoutes:
#      kinds:
#      - group: gateway.networking.k8s.io
#        kind: HTTPRoute
      namespaces:
        from: All
