apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  annotations:
  name: httpbin-route
  namespace: djmz
spec:
  hostnames:
  - httpbin.lxci.net
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: media-gateway
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: httpbin
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
