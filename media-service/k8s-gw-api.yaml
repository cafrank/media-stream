# https://istio.io/latest/docs/tasks/traffic-management/ingress/gateway-api/#automated-deployment
# kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml

# kubectl -n djmz port-forward service/media-gateway-istio --address=0.0.0.0 8080:80

apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: media-gateway
  namespace: djmz
spec:
  gatewayClassName: istio
  #  addresses:
  #  - value: ingress.istio-gateways.svc.cluster.local
  #    type: Hostname
  listeners:
    - name: prod-web
      port: 80
      protocol: HTTP
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
#      namespaces:
#        from: Selector
#        selector:
#          matchLabels:
#            expose-apps: "true"

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: media-route
  namespace: djmz
spec:
  parentRefs:
    - kind: Gateway
      name: media-gateway
      namespace: djmz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/media/*
    - backendRefs:
        - name: media-svc
          port: 8084

