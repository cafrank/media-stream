spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://${AUTH_DB_HOST:mysql}/${AUTH_DB_NAME:my12}?useSSL=false
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER:my12}
spring.datasource.password=${AUTH_DB_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Postgres Example
# https://github.com/OKaluzny/spring-boot-rest-api-postgresql/blob/master/src/main/resources/application.yml

server.port=8085
