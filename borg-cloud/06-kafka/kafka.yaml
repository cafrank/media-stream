# Kafka: 3-broker KRaft cluster (each pod is broker + controller), one per node.
#   in-cluster: kafka-bootstrap.${KAFKA_NAMESPACE}.svc.cluster.local:9092
#   host:       kafka.${KAFKA_DOMAIN}:443 over TLS via HAProxy on the VIP (SNI: kafka-N.${KAFKA_DOMAIN})
# Plaintext, no authentication (cluster and host-only network only).
# Rendered by install-kafka.sh (render_kafka): only the variables in KAFKA_VARS
# are substituted; start.sh's own shell variables are left alone.
apiVersion: v1
kind: Namespace
metadata:
  name: ${KAFKA_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-scripts
  namespace: ${KAFKA_NAMESPACE}
data:
  start.sh: |
    #!/bin/sh
    # Writes this broker's server.properties, formats its volume on first start
    # (--ignore-formatted: no-op afterwards) and runs Kafka.
    set -eu
    NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
    N=${POD_NAME##*-}
    H="kafka-headless.$NS.svc.cluster.local"
    # Kafka's PEM keystore wants the private key and the certificate chain in one file
    cat /etc/kafka/tls-src/tls.key /etc/kafka/tls-src/tls.crt > /tmp/keystore.pem
    cat > /tmp/server.properties <<EOF
    process.roles=broker,controller
    node.id=$N
    controller.quorum.voters=0@kafka-0.$H:9093,1@kafka-1.$H:9093,2@kafka-2.$H:9093
    listeners=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:${KAFKA_EXTERNAL_PORT}
    advertised.listeners=INTERNAL://kafka-$N.$H:9092,EXTERNAL://kafka-$N.${KAFKA_DOMAIN}:443
    listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SSL
    ssl.keystore.type=PEM
    ssl.keystore.location=/tmp/keystore.pem
    ssl.client.auth=none
    inter.broker.listener.name=INTERNAL
    controller.listener.names=CONTROLLER
    log.dirs=/var/lib/kafka/data
    num.partitions=3
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    EOF
    echo "start: node.id=$N advertised INTERNAL kafka-$N.$H:9092 EXTERNAL kafka-$N.${KAFKA_DOMAIN}:443 (TLS)"
    /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t "$CLUSTER_ID" -c /tmp/server.properties
    exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
---
# Per-broker DNS. publishNotReadyAddresses: brokers must reach each other (the
# controller quorum) before they are Ready.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: ${KAFKA_NAMESPACE}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: internal
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  namespace: ${KAFKA_NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: internal
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ${KAFKA_NAMESPACE}
spec:
  serviceName: kafka-headless
  replicas: 3
  # The controller quorum needs all voters starting together
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  # A restarted broker is Ready once it has rejoined the metadata quorum, but may
  # still be catching up on partitions; wait before stopping the next one, so a
  # rolling restart doesn't drop partitions below min.insync.replicas=2.
  minReadySeconds: 20
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
      annotations:
        borg/kafka-scripts-sha: "${KAFKA_SCRIPTS_SHA}"   # set by install-kafka.sh
        borg/kafka-tls-sha: "${KAFKA_TLS_SHA}"           # set by install-kafka.sh
    spec:
      securityContext:
        fsGroup: 1000            # the image runs as appuser (uid/gid 1000)
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kafka
      containers:
        - name: kafka
          image: ${KAFKA_IMAGE}
          command: ["sh", "/scripts/start.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-id
                  key: id
            - name: KAFKA_HEAP_OPTS
              value: "-Xms${KAFKA_HEAP} -Xmx${KAFKA_HEAP}"
          ports:
            - name: internal
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: external
              containerPort: ${KAFKA_EXTERNAL_PORT}
          readinessProbe:
            tcpSocket:
              port: internal
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: ${KAFKA_MEMORY_REQUEST}
            limits:
              memory: ${KAFKA_MEMORY_LIMIT}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tls
              mountPath: /etc/kafka/tls-src
              readOnly: true
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: scripts
          configMap:
            name: kafka-scripts
        - name: tls
          secret:
            secretName: kafka-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: ${KAFKA_STORAGE_SIZE}
---
# External (TLS) listener, reached only through HAProxy SSL passthrough on the VIP
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: ${KAFKA_NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: external
      port: 9094
      targetPort: external
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-0-external
  namespace: ${KAFKA_NAMESPACE}
spec:
  selector:
    statefulset.kubernetes.io/pod-name: kafka-0
  ports:
    - name: external
      port: 9094
      targetPort: external
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-1-external
  namespace: ${KAFKA_NAMESPACE}
spec:
  selector:
    statefulset.kubernetes.io/pod-name: kafka-1
  ports:
    - name: external
      port: 9094
      targetPort: external
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-2-external
  namespace: ${KAFKA_NAMESPACE}
spec:
  selector:
    statefulset.kubernetes.io/pod-name: kafka-2
  ports:
    - name: external
      port: 9094
      targetPort: external
---
# SNI passthrough: HAProxy forwards the raw TLS stream by server name (no decryption).
# These Services must not be used by any non-passthrough Ingress (one mode per backend).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-bootstrap-tls
  namespace: ${KAFKA_NAMESPACE}
  annotations:
    haproxy.org/ssl-passthrough: "true"
spec:
  ingressClassName: haproxy
  rules:
    - host: ${KAFKA_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-external
                port:
                  number: 9094
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-0-tls
  namespace: ${KAFKA_NAMESPACE}
  annotations:
    haproxy.org/ssl-passthrough: "true"
spec:
  ingressClassName: haproxy
  rules:
    - host: kafka-0.${KAFKA_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-0-external
                port:
                  number: 9094
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-1-tls
  namespace: ${KAFKA_NAMESPACE}
  annotations:
    haproxy.org/ssl-passthrough: "true"
spec:
  ingressClassName: haproxy
  rules:
    - host: kafka-1.${KAFKA_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-1-external
                port:
                  number: 9094
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-2-tls
  namespace: ${KAFKA_NAMESPACE}
  annotations:
    haproxy.org/ssl-passthrough: "true"
spec:
  ingressClassName: haproxy
  rules:
    - host: kafka-2.${KAFKA_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-2-external
                port:
                  number: 9094
