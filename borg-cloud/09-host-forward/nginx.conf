# Host forward: http://localhost:8080/ and http://<host LAN IP>:8080/ -> the BorgCloud VIP (HAProxy ingress).
# The VIP (192.168.56.120) is on VirtualBox's host-only network, reachable only from this host.
# Everything is forwarded as is: RecordPool at /, media-service at /api/media.
worker_processes 1;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        client_max_body_size 64m;           # POST /api/media/bulk
        location / {
            proxy_pass http://192.168.56.120;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_read_timeout 120s;
        }
    }
}
