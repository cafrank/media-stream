# record-pool web (Expo static export). Listens on 8080 as a non-root user.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundles and assets: cache for a year
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes: the exported page (/RecordPoolApp -> RecordPoolApp.html), else the
    # app shell, whose client-side router renders the route or +not-found
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
