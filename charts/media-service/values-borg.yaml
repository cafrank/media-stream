# =============================================================================
# BorgCloud (k3s on VirtualBox). Deployed by `make deploy-media` in borg-cloud/.
#   - image from the in-cluster registry (localhost:5050, mirrored on each node)
#   - MongoDB: the cluster's replica set (make provision-databases), database
#     media; deploy-media.sh writes the Secret media-service-mongodb
#   - HAProxy ingress on the VIP (make provision-edge): http://192.168.56.120/api/media
# =============================================================================
image:
  repository: localhost:5050/media3

mongodb:
  enabled: false

externalMongodb:
  existingSecret: media-service-mongodb

ingress:
  enabled: true
  className: haproxy
  hosts:
    - host: ""
      paths:
        - path: /api/media
          pathType: Prefix

# URL signing key for the CDN origin (www.my12inch.com, mod_lua signed_urls.lua; see
# cdn/mod-lua-signed-urls/README.md). Secret media-service-signing: SIGNING_KEY_NAME, SIGNING_KEY
# (base64url). Without it /stream and /download answer 503.
extraEnv:
  - name: SIGNING_KEY_NAME
    valueFrom:
      secretKeyRef:
        name: media-service-signing
        key: SIGNING_KEY_NAME
  - name: SIGNING_KEY
    valueFrom:
      secretKeyRef:
        name: media-service-signing
        key: SIGNING_KEY
