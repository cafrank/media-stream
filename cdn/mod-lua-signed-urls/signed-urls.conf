# /etc/httpd/conf.d/signed-urls.conf: signed URLs for /prev/gen3/ (#17)
# Needs: lua_module (00-lua.conf), headers_module, setenvif_module (all in CentOS 7's httpd package).

# No directory listings of the catalog. FollowSymLinks is kept (the files are symlinks into /mnt/disk*).
<Directory "/var/www/html/prev">
    Options -Indexes
</Directory>

<Location "/prev/gen3/">
    # One Lua state per httpd child (prefork), so the key file and the verified-URL cache are reused
    LuaScope thread
    LuaCodeCache stat

    # Phase 1, log only: invalid requests are served and logged to error_log as "signed_urls: would deny ..."
    LuaHookAccessChecker /etc/httpd/signed-urls/signed_urls.lua check_signed_url_log
    # Phase 2, enforce (403): comment the line above out and use this one instead
    #LuaHookAccessChecker /etc/httpd/signed-urls/signed_urls.lua check_signed_url

    # Signed download URLs (download=1) are saved by the browser instead of played.
    # SetEnvIfExpr, not SetEnvIf: SetEnvIf has no query-string attribute ("Query_String" is read as a
    # request header and never matches).
    SetEnvIfExpr "%{QUERY_STRING} =~ /(^|&)download=1(&|$)/" FORCE_DL
    Header set Content-Disposition "attachment" env=FORCE_DL
</Location>
